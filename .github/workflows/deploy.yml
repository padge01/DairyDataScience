# Builds the site and deploys it to Cloudflare: on every push to master, once a day (so the GitHub
# activity stays current), and on demand. Secrets, set in the repo's Settings > Secrets and variables > Actions:
#   CLOUDFLARE_API_TOKEN  a Cloudflare token with Workers edit on Pádraig's personal account
#   GH_STATS_TOKEN        optional; a GitHub token that can read his contribution counts. Without it the
#                         build uses github-snapshot.json, the numbers from the last local build.
name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 68eb3588992d75f05ccc646600922f64
